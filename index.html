<!DOCTYPE html>
<html lang="de" translate="no">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Theological Vocabulary & Sentence Workshop</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .perspective { perspective: 1000px; }
        .transform-style { transform-style: preserve-3d; }

        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>

    <header class="bg-slate-800 border-b border-slate-700 py-6 px-4 sm:px-8 shadow-md">

                <div class="flex items-center gap-3 mt-1">
                    <p class="text-slate-400 text-sm">Vocabulary, Flashcards, Quiz, Memory & Sentence Builder.</p>

                </div>
            </div>

            <div class="flex flex-wrap bg-slate-900 p-1 rounded-lg border border-slate-700">
